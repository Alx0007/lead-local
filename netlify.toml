# Publicação no Netlify.
# O app é estático: não tem build, então não há comando de compilação.
# A pasta publicada é a raiz do repositório.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# O CSS e o JS já são versionados por ?v= no index.html, então podem ser
# guardados em cache. O index.html não: é ele que aponta para a versão nova.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
